<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SITTA-UT</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="min-h-screen flex items-center justify-center relative overflow-hidden bg-blue-50">

    <!-- Wave Background -->
    <svg viewBox="0 0 1440 320" class="absolute bottom-0 left-0 w-full z-0 drop-shadow-lg pointer-events-none">
        <path fill="#1e3a8a" fill-opacity="1"
            d="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,144C672,139,768,181,864,197.3C960,213,1056,203,1152,176C1248,149,1344,107,1392,85.3L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z">
        </path>

        <path fill="#f97316" fill-opacity="0.9"
            d="M0,256L48,229.3C96,203,192,149,288,149.3C384,149,480,203,576,213.3C672,224,768,192,864,170.7C960,149,1056,139,1152,149.3C1248,160,1344,192,1392,208L1440,224L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z">
        </path>
    </svg>

    <!-- Login Card -->
    <div class="z-10 w-full max-w-md px-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 sm:p-10 border border-gray-100">

            <div class="text-center mb-8">
                <img 
                    src="assets/ut.png" 
                    onerror="this.onerror=null; this.src='assets/ut.png.webp';"
                    alt="Logo UT"
                    class="w-20 h-20 mx-auto mb-4 object-contain"
                >

                <h1 class="text-3xl font-bold text-blue-900 mb-2">
                    Login to SITTA-UT
                </h1>

                <p class="text-gray-500 text-sm">
                    Masuk ke sistem tracking dan bahan ajar
                </p>
            </div>

            <form id="loginForm" class="space-y-5">

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                        Email
                    </label>

                    <input 
                        type="email" 
                        id="email" 
                        placeholder="Masukan email Anda"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                        required
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                        Password
                    </label>

                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Masukkan password Anda"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                        required
                    >

                    <div class="flex justify-end mt-2">
                        <a href="#" id="forgetLink" class="text-sm text-blue-600 hover:text-orange-500 font-medium transition-colors">
                            Lupa Password?
                        </a>
                    </div>
                </div>

                <button 
                    type="submit"
                    class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5">
                    Login
                </button>
            </form>

            <div class="mt-8 text-center">
                <a href="#" id="registerLink" class="text-sm text-blue-600 hover:text-orange-500 font-medium transition-colors">
                    Belum punya akun?
                </a>
            </div>

        </div>
    </div>

    <script src="js/dataBahanAjar.js"></script>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            if (typeof dataPengguna === "undefined") {
                Swal.fire({
                    title: "Data Login Tidak Ditemukan",
                    text: "Pastikan file js/dataBahanAjar.js sudah tersedia dan dipanggil dengan benar.",
                    icon: "error",
                    confirmButtonColor: "#1e3a8a"
                });
                return;
            }

            const user = dataPengguna.find(function (item) {
                return item.email === email && item.password === password;
            });

            if (!user) {
                Swal.fire({
                    title: "Login Gagal",
                    text: "Email atau password salah.",
                    icon: "error",
                    confirmButtonColor: "#1e3a8a"
                });
                return;
            }

            localStorage.setItem("isLogin", "true");
            localStorage.setItem("namaUser", user.nama);
            localStorage.setItem("roleUser", user.role);
            localStorage.setItem("lokasiUser", user.lokasi);

            Swal.fire({
                title: "Login Berhasil!",
                text: "Selamat datang, " + user.nama + ".",
                icon: "success",
                confirmButtonColor: "#0ab5ff",
                confirmButtonText: "Lanjutkan"
            }).then(function () {
                window.location.href = "dashboard.html";
            });
        });

        document.getElementById("forgetLink").addEventListener("click", function (e) {
            e.preventDefault();

            Swal.fire({
                title: "Lupa Password?",
                text: "Silakan hubungi admin UT untuk reset password.",
                icon: "info",
                confirmButtonColor: "#1e3a8a"
            });
        });

        document.getElementById("registerLink").addEventListener("click", function (e) {
            e.preventDefault();

            Swal.fire({
                title: "Buat Akun Baru",
                text: "Silakan hubungi admin UT untuk pembuatan akun.",
                icon: "question",
                confirmButtonColor: "#1e3a8a"
            });
        });
    </script>

</body>
</html>
